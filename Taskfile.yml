version: "3"

tasks:
  db:
    desc: Levantar PostgreSQL local
    cmds:
      - docker compose up -d db

  db:migrate:
    desc: Aplicar migraciones locales con Sqitch
    cmds:
      - docker compose run --rm migrate

  api:
    desc: Levantar API local write/read
    dir: apps/api
    cmds:
      - |
        uv run uvicorn rifaapp.write.src.entrypoints.api:app --reload --host 0.0.0.0 --port 8000 &
        uv run uvicorn rifaapp.read.src.entrypoints.api:app --reload --host 0.0.0.0 --port 8001 &
        wait

  frontend:
    desc: Levantar frontend local
    dir: apps/frontend
    cmds:
      - npm run dev -- --host 0.0.0.0
