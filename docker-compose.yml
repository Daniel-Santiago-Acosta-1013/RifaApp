version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: rifaapp-db
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: rifaapp
    ports:
      - "5432:5432"
    volumes:
      - rifaapp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d rifaapp"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rifaapp-network

volumes:
  rifaapp_postgres_data:

networks:
  rifaapp-network:
    driver: bridge
