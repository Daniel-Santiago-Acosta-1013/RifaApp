name: Deploy Frontend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/frontend/**'

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_VERSION: '1.5.7'
  TG_VERSION: '0.96.1'
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TG_NON_INTERACTIVE: "true"

concurrency:
  group: rifaapp-frontend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy frontend to S3 + CloudFront
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Setup Terragrunt
        run: |
          curl -sL "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TG_VERSION }}/terragrunt_linux_amd64" -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Load frontend config from Parameter Store
        id: config
        run: |
          read_url=$(aws ssm get-parameter \
            --name "/rifaapp/dev/api-read-url" \
            --query "Parameter.Value" --output text)
          write_url=$(aws ssm get-parameter \
            --name "/rifaapp/dev/api-write-url" \
            --query "Parameter.Value" --output text)

          if [ -z "$read_url" ] || [ -z "$write_url" ]; then
            echo "VITE_API_READ_BASE_URL or VITE_API_WRITE_BASE_URL missing in Parameter Store" >&2
            exit 1
          fi

          echo "read_url=$read_url" >> "$GITHUB_OUTPUT"
          echo "write_url=$write_url" >> "$GITHUB_OUTPUT"
          echo "Config loaded from Parameter Store"

      - name: Apply frontend infra
        working-directory: infra/terraform/envs/frontend
        run: terragrunt --non-interactive apply -auto-approve

      - name: Read frontend outputs
        id: frontend
        working-directory: infra/terraform/envs/frontend
        run: |
          terragrunt output -json > /tmp/frontend_outputs.json
          python3 - <<'PY'
          import json
          import os

          with open("/tmp/frontend_outputs.json", "r", encoding="utf-8") as handle:
              data = json.load(handle)

          bucket = data.get("frontend_bucket_name", {}).get("value", "")
          distribution = data.get("frontend_distribution_id", {}).get("value", "")

          if not bucket or not distribution:
              raise SystemExit("frontend outputs are missing")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"bucket={bucket}\n")
              handle.write(f"distribution_id={distribution}\n")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm install

      - name: Build
        env:
          VITE_API_READ_BASE_URL: ${{ steps.config.outputs.read_url }}
          VITE_API_WRITE_BASE_URL: ${{ steps.config.outputs.write_url }}
        working-directory: apps/frontend
        run: npm run build

      - name: Upload to S3
        env:
          FRONTEND_BUCKET: ${{ steps.frontend.outputs.bucket }}
        working-directory: apps/frontend
        run: aws s3 sync dist "s3://$FRONTEND_BUCKET" --delete

      - name: Invalidate CloudFront
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ steps.frontend.outputs.distribution_id }}
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
