name: Infra Lifecycle

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose infra action: plan (preview), apply (deploy), destroy (remove), destroy-and-recreate (full rebuild)'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
          - destroy-and-recreate
      confirm_destroy:
        description: 'Required only for destroy or destroy-and-recreate. Type DESTROY to confirm.'
        required: false
        type: string

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_VERSION: '1.5.7'
  TG_VERSION: '0.96.1'
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TG_NON_INTERACTIVE: "true"
  PROJECT_NAME: rifaapp
  ENVIRONMENT: dev
  COGNITO_SES_EMAIL_IDENTITY: ''
  COGNITO_SES_SOURCE_ARN: ${{ vars.COGNITO_SES_SOURCE_ARN || '' }}
  COGNITO_FROM_EMAIL_ADDRESS: ${{ vars.COGNITO_FROM_EMAIL_ADDRESS || '' }}
  COGNITO_REPLY_TO_EMAIL_ADDRESS: ${{ vars.COGNITO_REPLY_TO_EMAIL_ADDRESS || '' }}
  COGNITO_EMAIL_SENDING_ACCOUNT: ${{ vars.COGNITO_EMAIL_SENDING_ACCOUNT || 'COGNITO_DEFAULT' }}
  COGNITO_PASSWORD_MINIMUM_LENGTH: ${{ vars.COGNITO_PASSWORD_MINIMUM_LENGTH || '8' }}

concurrency:
  group: rifaapp-infra-lifecycle
  cancel-in-progress: false

jobs:
  manage-infrastructure:
    name: ${{ github.event.inputs.action }} infrastructure
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Setup Terragrunt
        run: |
          curl -sL "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TG_VERSION }}/terragrunt_linux_amd64" -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: Confirm destroy
        if: ${{ github.event.inputs.action == 'destroy' || github.event.inputs.action == 'destroy-and-recreate' }}
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "DESTROY" ]; then
            echo "ERROR: To destroy infrastructure, set confirm_destroy to DESTROY."
            exit 1
          fi

      - name: Explain scope
        run: |
          echo "Action: ${{ github.event.inputs.action }}"
          echo "Target directories:"
          echo "  - infra/terraform/live (shared + lambdas)"
          echo "  - infra/terraform/envs/frontend"
          echo "The Terraform remote state S3 bucket (bootstrap) is NOT part of this scope."

      - name: Terragrunt plan all (live)
        if: ${{ github.event.inputs.action == 'plan' }}
        working-directory: infra/terraform/live
        run: |
          terragrunt --non-interactive run --all -- plan

      - name: Terragrunt plan (frontend)
        if: ${{ github.event.inputs.action == 'plan' }}
        working-directory: infra/terraform/envs/frontend
        run: |
          terragrunt --non-interactive plan

      - name: Ensure Lambda build artifacts exist for destroy refresh
        if: ${{ github.event.inputs.action == 'destroy' || github.event.inputs.action == 'destroy-and-recreate' }}
        run: |
          # Terraform destroy still refreshes data.archive_file sources.
          # Create minimal dummy files so the data sources can build non-empty archives.
          mkdir -p infra/backend/lambda_dist/read
          echo "def handler(event,context):return{}" > infra/backend/lambda_dist/read/index.py
          mkdir -p infra/backend/lambda_dist/write
          echo "def handler(event,context):return{}" > infra/backend/lambda_dist/write/index.py
          mkdir -p infra/backend/lambda_dist/realtime
          echo "def handler(event,context):return{}" > infra/backend/lambda_dist/realtime/index.py
          mkdir -p infra/backend/lambda_dist/layer-read/python
          touch infra/backend/lambda_dist/layer-read/python/.gitkeep
          mkdir -p infra/backend/lambda_dist/layer-write/python
          touch infra/backend/lambda_dist/layer-write/python/.gitkeep
          echo "Created placeholder Lambda build artifacts."

      - name: Cleanup orphaned AWS resources in project VPC
        if: ${{ github.event.inputs.action == 'destroy' || github.event.inputs.action == 'destroy-and-recreate' }}
        run: |
          PROJECT_NAME="${PROJECT_NAME:-rifaapp}"
          ENVIRONMENT="${ENVIRONMENT:-dev}"
          VPC_NAME="${PROJECT_NAME}-${ENVIRONMENT}-vpc"

          echo "Looking up VPC by tag Name=$VPC_NAME..."
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=$VPC_NAME" \
            --query 'Vpcs[0].VpcId' --output text 2>/dev/null || echo "")

          if [ -n "$VPC_ID" ] && [ "$VPC_ID" != "None" ]; then
            echo "Found project VPC: $VPC_ID"

            echo "Deleting Load Balancers in VPC $VPC_ID..."
            for arn in $(aws elbv2 describe-load-balancers \
              --query "LoadBalancers[?VpcId=='$VPC_ID'].LoadBalancerArn" --output text 2>/dev/null); do
              echo "  Deleting LB $arn"
              aws elbv2 delete-load-balancer --load-balancer-arn "$arn" || true
            done

            echo "Deleting Target Groups in VPC $VPC_ID..."
            for arn in $(aws elbv2 describe-target-groups \
              --query "TargetGroups[?VpcId=='$VPC_ID'].TargetGroupArn" --output text 2>/dev/null); do
              echo "  Deleting TG $arn"
              aws elbv2 delete-target-group --target-group-arn "$arn" || true
            done

            echo "Deleting available ENIs in VPC $VPC_ID..."
            for eni in $(aws ec2 describe-network-interfaces \
              --filters "Name=vpc-id,Values=$VPC_ID" \
              --query 'NetworkInterfaces[?Status==`available`].NetworkInterfaceId' --output text 2>/dev/null); do
              echo "  Deleting ENI $eni"
              aws ec2 delete-network-interface --network-interface-id "$eni" || true
            done

            echo "Waiting 30s for AWS to finish detaching dependent resources..."
            sleep 30
          else
            echo "No project VPC found with tag Name=$VPC_NAME. Skipping orphaned resource cleanup."
          fi

      - name: Empty frontend bucket before destroy
        if: ${{ github.event.inputs.action == 'destroy' || github.event.inputs.action == 'destroy-and-recreate' }}
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          PROJECT_NAME="${PROJECT_NAME:-rifaapp}"
          STATE_BUCKET="${PROJECT_NAME}-terraform-state-${ACCOUNT_ID}"
          STATE_KEY="rifaapp/frontend/terraform.tfstate"
          STATE_FILE="${RUNNER_TEMP}/frontend.tfstate"

          if ! aws s3api head-object --bucket "$STATE_BUCKET" --key "$STATE_KEY" >/dev/null 2>&1; then
            echo "Frontend state s3://${STATE_BUCKET}/${STATE_KEY} not found. Skipping frontend bucket cleanup."
            exit 0
          fi

          aws s3api get-object --bucket "$STATE_BUCKET" --key "$STATE_KEY" "$STATE_FILE" >/dev/null
          FRONTEND_BUCKET="$(jq -r '.resources[]? | select(.type=="aws_s3_bucket" and .name=="frontend") | .instances[]?.attributes.bucket // empty' "$STATE_FILE" | head -n 1)"

          if [ -z "$FRONTEND_BUCKET" ]; then
            echo "Frontend bucket not found in Terraform state. Skipping cleanup."
            exit 0
          fi

          if ! aws s3api head-bucket --bucket "$FRONTEND_BUCKET" >/dev/null 2>&1; then
            echo "Frontend bucket $FRONTEND_BUCKET does not exist. Skipping cleanup."
            exit 0
          fi

          echo "Emptying frontend bucket s3://${FRONTEND_BUCKET} before Terraform destroy..."
          aws s3 rm "s3://${FRONTEND_BUCKET}" --recursive || true

          while true; do
            versions_file="${RUNNER_TEMP}/frontend-bucket-versions.json"
            delete_file="${RUNNER_TEMP}/frontend-bucket-delete.json"
            aws s3api list-object-versions --bucket "$FRONTEND_BUCKET" --max-items 1000 > "$versions_file"
            jq '{Objects: ((.Versions // []) + (.DeleteMarkers // []) | map({Key, VersionId})), Quiet: true}' "$versions_file" > "$delete_file"
            object_count="$(jq '.Objects | length' "$delete_file")"
            if [ "$object_count" -eq 0 ]; then
              break
            fi
            echo "Deleting $object_count versioned objects/delete markers from $FRONTEND_BUCKET..."
            aws s3api delete-objects --bucket "$FRONTEND_BUCKET" --delete "file://${delete_file}" >/dev/null
          done

      - name: Terragrunt destroy (frontend)
        if: ${{ github.event.inputs.action == 'destroy' || github.event.inputs.action == 'destroy-and-recreate' }}
        continue-on-error: true
        working-directory: infra/terraform/envs/frontend
        run: |
          terragrunt --non-interactive destroy -auto-approve

      - name: Terragrunt destroy all (live)
        if: ${{ github.event.inputs.action == 'destroy' || github.event.inputs.action == 'destroy-and-recreate' }}
        continue-on-error: true
        working-directory: infra/terraform/live
        run: |
          terragrunt --log-level error --non-interactive run --all -- destroy -auto-approve

      - name: Post-destroy cleanup of remaining project resources
        if: ${{ github.event.inputs.action == 'destroy' || github.event.inputs.action == 'destroy-and-recreate' }}
        run: |
          PROJECT_NAME="${PROJECT_NAME:-rifaapp}"
          ENVIRONMENT="${ENVIRONMENT:-dev}"
          NAME_PREFIX="${PROJECT_NAME}-${ENVIRONMENT}"

          echo "=== Cleaning up Lambda Layers ==="
          for layer_name in $(aws lambda list-layers --query "Layers[?starts_with(LayerName, \`${NAME_PREFIX}\`)].LayerName" --output text 2>/dev/null); do
            for version in $(aws lambda list-layer-versions --layer-name "$layer_name" --query 'LayerVersions[].Version' --output text 2>/dev/null); do
              echo "  Deleting Lambda Layer $layer_name version $version"
              aws lambda delete-layer-version --layer-name "$layer_name" --version-number "$version" 2>/dev/null || true
            done
          done

          echo "=== Cleaning up CloudWatch Log Groups ==="
          for log_group in $(aws logs describe-log-groups --log-group-name-prefix "/aws/lambda/${NAME_PREFIX}" --query 'logGroups[*].logGroupName' --output text 2>/dev/null); do
            echo "  Deleting log group $log_group"
            aws logs delete-log-group --log-group-name "$log_group" || true
          done
          for log_group in $(aws logs describe-log-groups --log-group-name-prefix "/aws/codebuild/${NAME_PREFIX}" --query 'logGroups[*].logGroupName' --output text 2>/dev/null); do
            echo "  Deleting log group $log_group"
            aws logs delete-log-group --log-group-name "$log_group" || true
          done

          echo "=== Cleaning up RDS manual snapshots ==="
          for snapshot_id in $(aws rds describe-db-cluster-snapshots --snapshot-type manual --query "DBClusterSnapshots[?starts_with(DBClusterSnapshotIdentifier, \`${NAME_PREFIX}-aurora\`)].DBClusterSnapshotIdentifier" --output text 2>/dev/null); do
            echo "  Deleting DB cluster snapshot $snapshot_id"
            aws rds delete-db-cluster-snapshot --db-cluster-snapshot-identifier "$snapshot_id" || true
          done

          echo "=== Cleaning up API Gateway HTTP APIs ==="
          for api_id in $(aws apigatewayv2 get-apis --query "Items[?Name==\`${NAME_PREFIX}-http-api\`].ApiId" --output text 2>/dev/null); do
            echo "  Deleting HTTP API $api_id"
            aws apigatewayv2 delete-api --api-id "$api_id" || true
          done
          echo "=== Cleaning up API Gateway WebSocket APIs ==="
          for api_id in $(aws apigatewayv2 get-apis --query "Items[?Name==\`${NAME_PREFIX}-realtime-ws\`].ApiId" --output text 2>/dev/null); do
            echo "  Deleting WebSocket API $api_id"
            aws apigatewayv2 delete-api --api-id "$api_id" || true
          done

          echo "=== Cleaning up Cognito user pools ==="
          for pool_id in $(aws cognito-idp list-user-pools --max-results 60 --query "UserPools[?Name==\`${NAME_PREFIX}-users\`].Id" --output text 2>/dev/null); do
            echo "  Deleting Cognito user pool $pool_id"
            aws cognito-idp delete-user-pool --user-pool-id "$pool_id" || true
          done

          echo "=== Cleaning up DynamoDB realtime tables ==="
          for table_name in $(aws dynamodb list-tables --query "TableNames[?starts_with(@, \`${NAME_PREFIX}-realtime-\`)]" --output text 2>/dev/null); do
            echo "  Deleting DynamoDB table $table_name"
            aws dynamodb delete-table --table-name "$table_name" || true
            aws dynamodb wait table-not-exists --table-name "$table_name" || true
          done

          echo "=== Cleaning up migration artifact buckets ==="
          for bucket in $(aws s3api list-buckets --query "Buckets[?starts_with(Name, \`${NAME_PREFIX}-migration-artifacts-\`)].Name" --output text 2>/dev/null); do
            echo "  Emptying and deleting S3 bucket $bucket"
            aws s3 rm "s3://${bucket}" --recursive || true

            while true; do
              versions_file="${RUNNER_TEMP}/${bucket}-versions.json"
              delete_file="${RUNNER_TEMP}/${bucket}-delete.json"
              if ! aws s3api list-object-versions --bucket "$bucket" --max-items 1000 > "$versions_file" 2>/dev/null; then
                break
              fi
              jq '{Objects: ((.Versions // []) + (.DeleteMarkers // []) | map({Key, VersionId})), Quiet: true}' "$versions_file" > "$delete_file"
              object_count="$(jq '.Objects | length' "$delete_file")"
              if [ "$object_count" -eq 0 ]; then
                break
              fi
              echo "  Deleting $object_count versioned objects/delete markers from $bucket"
              aws s3api delete-objects --bucket "$bucket" --delete "file://${delete_file}" >/dev/null || true
            done

            aws s3api delete-bucket --bucket "$bucket" || true
          done

          echo "=== Cleaning up tagged Secrets Manager secrets ==="
          for secret_arn in $(aws resourcegroupstaggingapi get-resources --tag-filters Key=Project,Values="$PROJECT_NAME" Key=Environment,Values="$ENVIRONMENT" --query 'ResourceTagMappingList[?contains(ResourceARN, `:secret:`)].ResourceARN' --output text 2>/dev/null); do
            echo "  Force deleting secret $secret_arn"
            aws secretsmanager delete-secret --secret-id "$secret_arn" --force-delete-without-recovery 2>/dev/null || true
          done

          echo "=== Cleaning up residual EC2 network resources ==="
          endpoint_ids="$(aws ec2 describe-vpc-endpoints --filters "Name=tag:Project,Values=$PROJECT_NAME" "Name=tag:Environment,Values=$ENVIRONMENT" --query 'VpcEndpoints[?State!=`deleted`].VpcEndpointId' --output text 2>/dev/null || true)"
          if [ -n "$endpoint_ids" ]; then
            echo "  Deleting VPC endpoints: $endpoint_ids"
            aws ec2 delete-vpc-endpoints --vpc-endpoint-ids $endpoint_ids || true
            for attempt in $(seq 1 60); do
              remaining="$(aws ec2 describe-vpc-endpoints --vpc-endpoint-ids $endpoint_ids --query 'VpcEndpoints[?State!=`deleted`].VpcEndpointId' --output text 2>/dev/null || true)"
              if [ -z "$remaining" ]; then
                break
              fi
              echo "  Waiting for VPC endpoints to delete: $remaining"
              sleep 10
            done
          fi

          nat_ids="$(aws ec2 describe-nat-gateways --filter "Name=tag:Project,Values=$PROJECT_NAME" "Name=tag:Environment,Values=$ENVIRONMENT" --query 'NatGateways[?State!=`deleted`].NatGatewayId' --output text 2>/dev/null || true)"
          if [ -n "$nat_ids" ]; then
            echo "  Deleting NAT gateways: $nat_ids"
            for nat_id in $nat_ids; do
              aws ec2 delete-nat-gateway --nat-gateway-id "$nat_id" || true
            done
            aws ec2 wait nat-gateway-deleted --nat-gateway-ids $nat_ids || true
          fi

          for vpc_id in $(aws ec2 describe-vpcs --filters "Name=tag:Project,Values=$PROJECT_NAME" "Name=tag:Environment,Values=$ENVIRONMENT" --query 'Vpcs[].VpcId' --output text 2>/dev/null); do
            for eni in $(aws ec2 describe-network-interfaces --filters "Name=vpc-id,Values=$vpc_id" --query 'NetworkInterfaces[?Status==`available`].NetworkInterfaceId' --output text 2>/dev/null); do
              echo "  Deleting available ENI $eni"
              aws ec2 delete-network-interface --network-interface-id "$eni" || true
            done
          done

          for allocation_id in $(aws ec2 describe-addresses --filters "Name=tag:Project,Values=$PROJECT_NAME" "Name=tag:Environment,Values=$ENVIRONMENT" --query 'Addresses[?AssociationId==null].AllocationId' --output text 2>/dev/null); do
            echo "  Releasing Elastic IP $allocation_id"
            aws ec2 release-address --allocation-id "$allocation_id" || true
          done

      - name: Verify project resources are gone
        if: ${{ github.event.inputs.action == 'destroy' || github.event.inputs.action == 'destroy-and-recreate' }}
        run: |
          PROJECT_NAME="${PROJECT_NAME:-rifaapp}"
          ENVIRONMENT="${ENVIRONMENT:-dev}"
          NAME_PREFIX="${PROJECT_NAME}-${ENVIRONMENT}"
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          STATE_BUCKET="${PROJECT_NAME}-terraform-state-${ACCOUNT_ID}"
          leftovers=0

          echo "Allowed residual resource: s3://${STATE_BUCKET}"

          echo "=== Tagged resources ==="
          for arn in $(aws resourcegroupstaggingapi get-resources --tag-filters Key=Project,Values="$PROJECT_NAME" Key=Environment,Values="$ENVIRONMENT" --query 'ResourceTagMappingList[].ResourceARN' --output text 2>/dev/null); do
            if [ "$arn" = "arn:aws:s3:::${STATE_BUCKET}" ]; then
              continue
            fi
            if [[ "$arn" == arn:aws:s3:::* ]]; then
              bucket_name="${arn#arn:aws:s3:::}"
              if ! aws s3api head-bucket --bucket "$bucket_name" >/dev/null 2>&1; then
                echo "  Ignoring stale tagged S3 bucket: $arn"
                continue
              fi
            fi
            if [[ "$arn" == *":vpc-endpoint/"* ]]; then
              endpoint_id="${arn##*/}"
              endpoint_state="$(aws ec2 describe-vpc-endpoints --vpc-endpoint-ids "$endpoint_id" --query 'VpcEndpoints[0].State' --output text 2>/dev/null || true)"
              if [ -z "$endpoint_state" ] || [ "$endpoint_state" = "None" ] || [ "$endpoint_state" = "deleted" ]; then
                echo "  Ignoring stale tagged VPC endpoint: $arn"
                continue
              fi
            fi
            if [[ "$arn" == *":natgateway/"* ]]; then
              nat_id="${arn##*/}"
              nat_state="$(aws ec2 describe-nat-gateways --nat-gateway-ids "$nat_id" --query 'NatGateways[0].State' --output text 2>/dev/null || true)"
              if [ -z "$nat_state" ] || [ "$nat_state" = "None" ] || [ "$nat_state" = "deleted" ]; then
                echo "  Ignoring stale tagged NAT gateway: $arn"
                continue
              fi
            fi
            if [[ "$arn" == *":userpool/"* ]]; then
              pool_id="${arn##*/}"
              if ! aws cognito-idp describe-user-pool --user-pool-id "$pool_id" >/dev/null 2>&1; then
                echo "  Ignoring stale tagged Cognito user pool: $arn"
                continue
              fi
            fi
            echo "  Remaining tagged resource: $arn"
            leftovers=1
          done

          echo "=== Project S3 buckets ==="
          for bucket in $(aws s3api list-buckets --query "Buckets[?starts_with(Name, \`${NAME_PREFIX}-\`) || Name==\`${STATE_BUCKET}\`].Name" --output text 2>/dev/null); do
            if [ "$bucket" = "$STATE_BUCKET" ]; then
              continue
            fi
            echo "  Remaining S3 bucket: $bucket"
            leftovers=1
          done

          echo "=== Project CloudWatch log groups ==="
          for prefix in "/aws/lambda/${NAME_PREFIX}" "/aws/codebuild/${NAME_PREFIX}"; do
            for log_group in $(aws logs describe-log-groups --log-group-name-prefix "$prefix" --query 'logGroups[*].logGroupName' --output text 2>/dev/null); do
              echo "  Remaining log group: $log_group"
              leftovers=1
            done
          done

          echo "=== Project RDS snapshots ==="
          for snapshot_id in $(aws rds describe-db-cluster-snapshots --snapshot-type manual --query "DBClusterSnapshots[?starts_with(DBClusterSnapshotIdentifier, \`${NAME_PREFIX}-aurora\`)].DBClusterSnapshotIdentifier" --output text 2>/dev/null); do
            echo "  Remaining DB cluster snapshot: $snapshot_id"
            leftovers=1
          done

          echo "=== Project Lambda layers ==="
          for layer_name in $(aws lambda list-layers --query "Layers[?starts_with(LayerName, \`${NAME_PREFIX}\`)].LayerName" --output text 2>/dev/null); do
            echo "  Remaining Lambda layer: $layer_name"
            leftovers=1
          done

          echo "=== Project HTTP APIs ==="
          for api_id in $(aws apigatewayv2 get-apis --query "Items[?Name==\`${NAME_PREFIX}-http-api\`].ApiId" --output text 2>/dev/null); do
            echo "  Remaining HTTP API: $api_id"
            leftovers=1
          done
          echo "=== Project WebSocket APIs ==="
          for api_id in $(aws apigatewayv2 get-apis --query "Items[?Name==\`${NAME_PREFIX}-realtime-ws\`].ApiId" --output text 2>/dev/null); do
            echo "  Remaining WebSocket API: $api_id"
            leftovers=1
          done

          echo "=== Project Cognito user pools ==="
          for pool_id in $(aws cognito-idp list-user-pools --max-results 60 --query "UserPools[?Name==\`${NAME_PREFIX}-users\`].Id" --output text 2>/dev/null); do
            echo "  Remaining Cognito user pool: $pool_id"
            leftovers=1
          done

          echo "=== Project DynamoDB tables ==="
          for table_name in $(aws dynamodb list-tables --query "TableNames[?starts_with(@, \`${NAME_PREFIX}-realtime-\`)]" --output text 2>/dev/null); do
            echo "  Remaining DynamoDB table: $table_name"
            leftovers=1
          done

          if [ "$leftovers" -ne 0 ]; then
            echo "ERROR: Project resources remain after destroy."
            exit 1
          fi

          echo "Destroy verification passed. Only the remote state bucket is allowed to remain."

      - name: Setup Python
        if: ${{ github.event.inputs.action == 'apply' || github.event.inputs.action == 'destroy-and-recreate' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        if: ${{ github.event.inputs.action == 'apply' || github.event.inputs.action == 'destroy-and-recreate' }}
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build Lambda packages
        if: ${{ github.event.inputs.action == 'apply' || github.event.inputs.action == 'destroy-and-recreate' }}
        working-directory: apps/api
        run: ./scripts/build_lambda.sh

      - name: Copy Lambda artifacts to backend path
        if: ${{ github.event.inputs.action == 'apply' || github.event.inputs.action == 'destroy-and-recreate' }}
        run: |
          mkdir -p infra/backend/lambda_dist
          cp -r apps/api/lambda_dist/* infra/backend/lambda_dist/ || true

      - name: Terragrunt apply all (live)
        if: ${{ github.event.inputs.action == 'apply' || github.event.inputs.action == 'destroy-and-recreate' }}
        working-directory: infra/terraform/live
        run: |
          terragrunt --non-interactive run --all -- apply -auto-approve

      - name: Terragrunt apply (frontend)
        if: ${{ github.event.inputs.action == 'apply' || github.event.inputs.action == 'destroy-and-recreate' }}
        working-directory: infra/terraform/envs/frontend
        run: |
          terragrunt --non-interactive apply -auto-approve
