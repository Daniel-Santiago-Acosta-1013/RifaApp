name: Deploy Lambda

on:
  workflow_dispatch:
    inputs:
      lambda_target:
        description: "Target lambda(s) to deploy (both, read, write, realtime, none)"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - read
          - write
          - realtime
          - none
      backend_ref:
        description: "Ref del backend (branch o tag)"
        required: true
        default: "main"
        type: string
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_VERSION: '1.5.7'
  TG_VERSION: '0.96.1'
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TG_NON_INTERACTIVE: "true"
  BACKEND_REF: ${{ github.event.inputs.backend_ref || github.sha }}
  LAMBDA_TARGET: ${{ github.event.inputs.lambda_target || 'both' }}

concurrency:
  group: rifaapp-lambda-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Lambda packages
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BACKEND_REF }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build Lambda packages
        working-directory: apps/api
        run: ./scripts/build_lambda.sh

      - name: Copy Lambda artifacts to backend path
        run: |
          mkdir -p infra/backend/lambda_dist
          cp -r apps/api/lambda_dist/* infra/backend/lambda_dist/ || true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Setup Terragrunt
        run: |
          curl -sL "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TG_VERSION }}/terragrunt_linux_amd64" -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Apply lambdas only
        run: |
          if [ "$LAMBDA_TARGET" = "none" ]; then
            echo "lambda_target is none; skipping apply."
            exit 0
          fi
          if [ "$LAMBDA_TARGET" = "read" ] || [ "$LAMBDA_TARGET" = "both" ]; then
            echo "Applying read lambda..."
            pushd infra/terraform/live/lambdas/rifa-app-read
            terragrunt --non-interactive apply -auto-approve
            popd
          fi
          if [ "$LAMBDA_TARGET" = "realtime" ] || [ "$LAMBDA_TARGET" = "both" ]; then
            echo "Applying realtime lambda..."
            pushd infra/terraform/live/shared/realtime
            terragrunt --non-interactive apply -auto-approve
            popd
          fi
          if [ "$LAMBDA_TARGET" = "write" ] || [ "$LAMBDA_TARGET" = "both" ]; then
            echo "Applying write lambda..."
            pushd infra/terraform/live/lambdas/rifa-app-write
            terragrunt --non-interactive apply -auto-approve
            popd
          fi
