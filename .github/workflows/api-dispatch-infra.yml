name: Trigger Deploy Lambda

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag a crear despues del deploy (formato: vX.Y.Z)"
        required: true
        type: string
      force_deploy_both:
        description: "Forzar redeploy de ambas lambdas (ignora detección de cambios)"
        required: false
        type: boolean
        default: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate infra repo
        env:
          INFRA_REPO: ${{ vars.INFRA_REPO || github.repository }}
        run: |
          if [ -z "$INFRA_REPO" ]; then
            echo "INFRA_REPO is not set" >&2
            exit 1
          fi
          if ! [[ "${{ inputs.tag_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag_name must follow vX.Y.Z format (example: v1.2.3)" >&2
            exit 1
          fi
          git fetch --tags
          if git rev-parse "${{ inputs.tag_name }}" >/dev/null 2>&1; then
            echo "Tag already exists in backend: ${{ inputs.tag_name }}" >&2
            exit 1
          fi

      - name: Detect lambda target
        id: detect
        run: |
          set -euo pipefail
          if [ "${{ inputs.force_deploy_both }}" = "true" ]; then
            echo "force_deploy_both=true; deploying both lambdas."
            echo "lambda_target=both" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE_TAG="$(git describe --tags --match "v*" --abbrev=0 2>/dev/null || true)"
          if [ -z "$BASE_TAG" ]; then
            echo "No previous tag found; deploying both lambdas."
            echo "lambda_target=both" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Comparing changes from $BASE_TAG to HEAD..."
          CHANGED_FILES="$(git diff --name-only "$BASE_TAG"..HEAD)"
          if [ -z "$CHANGED_FILES" ]; then
            echo "No changes detected since $BASE_TAG."
            echo "lambda_target=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          read_changed="false"
          write_changed="false"
          shared_changed="false"

          while IFS= read -r file; do
            case "$file" in
              rifaapp/read/*)
                read_changed="true"
                ;;
              rifaapp/write/*|rifaapp/db/*)
                write_changed="true"
                ;;
              rifaapp/shared/*|rifaapp/__init__.py|pyproject.toml|uv.lock|scripts/build_lambda.sh)
                shared_changed="true"
                ;;
            esac
          done <<< "$CHANGED_FILES"

          if [ "$shared_changed" = "true" ]; then
            echo "Shared changes detected; deploying both lambdas."
            echo "lambda_target=both" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$read_changed" = "true" ] && [ "$write_changed" = "true" ]; then
            echo "Changes detected in read and write; deploying both."
            echo "lambda_target=both" >> "$GITHUB_OUTPUT"
          elif [ "$read_changed" = "true" ]; then
            echo "Changes detected in read; deploying read."
            echo "lambda_target=read" >> "$GITHUB_OUTPUT"
          elif [ "$write_changed" = "true" ]; then
            echo "Changes detected in write; deploying write."
            echo "lambda_target=write" >> "$GITHUB_OUTPUT"
          else
            echo "No lambda changes detected."
            echo "lambda_target=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch deploy to infra repo and wait
        if: steps.detect.outputs.lambda_target != 'none'
        env:
          INFRA_REPO: ${{ vars.INFRA_REPO || github.repository }}
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          INFRA_REF: "main"
          WORKFLOW_FILE: "deploy-lambda.yml"
          POLL_INTERVAL: "20"
          TIMEOUT_SECONDS: "1800"
          LAMBDA_TARGET: ${{ steps.detect.outputs.lambda_target }}
          BACKEND_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "INFRA_DISPATCH_TOKEN is not set" >&2
            exit 1
          fi
          if [ -z "$LAMBDA_TARGET" ]; then
            echo "lambda_target output is empty" >&2
            exit 1
          fi

          API_BASE="https://api.github.com"
          START_TS="$(date -u +%s)"
          DEADLINE=$((START_TS + TIMEOUT_SECONDS))

          HTTP_CODE="$(curl -sS -o /tmp/dispatch_resp.json -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_BASE/repos/$INFRA_REPO/actions/workflows/$WORKFLOW_FILE/dispatches" \
            -d '{"ref":"'"${INFRA_REF}"'","inputs":{"lambda_target":"'"${LAMBDA_TARGET}"'","backend_ref":"'"${BACKEND_REF}"'"}}')"

          if [ "$HTTP_CODE" != "204" ]; then
            echo "Failed to dispatch infra workflow. HTTP $HTTP_CODE" >&2
            cat /tmp/dispatch_resp.json >&2 || true
            exit 1
          fi

          echo "Waiting for infra workflow run to start..."
          RUN_ID=""
          while [ -z "$RUN_ID" ]; do
            NOW="$(date -u +%s)"
            if [ "$NOW" -ge "$DEADLINE" ]; then
              echo "Timed out waiting for infra workflow run to start." >&2
              exit 1
            fi

            RUNS_JSON="$(curl -sS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API_BASE/repos/$INFRA_REPO/actions/workflows/$WORKFLOW_FILE/runs?event=workflow_dispatch&branch=$INFRA_REF&per_page=5")"

            RUN_ID="$(START_TS="$START_TS" RUNS_JSON="$RUNS_JSON" python3 - <<'PY'
          import datetime
          import json
          import os
          import sys

          data = json.loads(os.environ["RUNS_JSON"])
          start_ts = int(os.environ["START_TS"])

          def to_epoch(ts):
              return int(datetime.datetime.fromisoformat(ts.replace("Z", "+00:00")).timestamp())

          for run in data.get("workflow_runs", []):
              if to_epoch(run["created_at"]) >= start_ts - 5:
                  print(run["id"])
                  sys.exit(0)
          PY
            )"

            if [ -z "$RUN_ID" ]; then
              sleep "$POLL_INTERVAL"
            fi
          done

          echo "Waiting for infra workflow run $RUN_ID to complete..."
          while true; do
            NOW="$(date -u +%s)"
            if [ "$NOW" -ge "$DEADLINE" ]; then
              echo "Timed out waiting for infra workflow run to complete." >&2
              exit 1
            fi

            RUN_INFO_JSON="$(curl -sS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API_BASE/repos/$INFRA_REPO/actions/runs/$RUN_ID")"

            RUN_INFO="$(RUN_INFO_JSON="$RUN_INFO_JSON" python3 - <<'PY'
          import json
          import os
          import sys

          data = json.loads(os.environ["RUN_INFO_JSON"])
          status = data.get("status", "")
          conclusion = data.get("conclusion") or ""
          html_url = data.get("html_url", "")
          print(f"{status}|{conclusion}|{html_url}")
          PY
            )"

            STATUS="${RUN_INFO%%|*}"
            REST="${RUN_INFO#*|}"
            CONCLUSION="${REST%%|*}"
            RUN_URL="${REST#*|}"

            if [ "$STATUS" = "completed" ]; then
              echo "Infra workflow completed: $CONCLUSION"
              echo "Run URL: $RUN_URL"
              if [ "$CONCLUSION" = "success" ]; then
                exit 0
              fi
              exit 1
            fi

            sleep "$POLL_INTERVAL"
          done

      - name: Create git tag
        if: success() && steps.detect.outputs.lambda_target != 'none'
        env:
          TAG_NAME: ${{ inputs.tag_name }}
          TAGGER_EMAIL: ${{ vars.TAGGER_EMAIL }}
        run: |
          set -euo pipefail
          if [ -z "$TAG_NAME" ]; then
            echo "tag_name input is required." >&2
            exit 1
          fi
          if ! [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag_name must follow vX.Y.Z format (example: v1.2.3)" >&2
            exit 1
          fi
          if [ -z "$TAGGER_EMAIL" ]; then
            echo "TAGGER_EMAIL repo variable is not set." >&2
            exit 1
          fi
          git fetch --tags
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag already exists in backend: $TAG_NAME" >&2
            exit 1
          fi
          git config user.email "$TAGGER_EMAIL"
          git config user.name "${GITHUB_ACTOR}"
          git tag -a "$TAG_NAME" -m "Deploy $TAG_NAME"
          git push origin "$TAG_NAME"
