name: Migrate Database

on:
  workflow_dispatch:
    inputs:
      backend_ref:
        description: "Ref del backend para migraciones (branch o tag). Opcional."
        required: false
        default: "main"
        type: string
      target:
        description: "Tipo de migracion"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - verify
          - status

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_VERSION: '1.5.7'
  TG_VERSION: '0.96.1'
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TG_NON_INTERACTIVE: "true"

concurrency:
  group: rifaapp-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Run database migrations
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.backend_ref || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Setup Terragrunt
        run: |
          curl -sL "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TG_VERSION }}/terragrunt_linux_amd64" -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read DB outputs from Terraform
        id: db
        working-directory: infra/terraform/live/shared/db
        run: |
          terragrunt output -json > /tmp/db_outputs.json
          python3 - <<'PY'
          import json, os
          with open("/tmp/db_outputs.json", "r") as f:
              data = json.load(f)
          endpoint = data.get("db_cluster_endpoint", {}).get("value", "")
          port = str(data.get("db_port", {}).get("value", "5432"))
          name = data.get("db_name", {}).get("value", "rifaapp")
          user = data.get("db_username", {}).get("value", "appuser")
          secret_arn = data.get("db_secret_arn", {}).get("value", "")
          artifact_bucket = data.get("migration_artifact_bucket", {}).get("value", "")
          codebuild_project = data.get("migration_codebuild_project_name", {}).get("value", "")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"endpoint={endpoint}\n")
              f.write(f"port={port}\n")
              f.write(f"name={name}\n")
              f.write(f"user={user}\n")
              f.write(f"secret_arn={secret_arn}\n")
              f.write(f"artifact_bucket={artifact_bucket}\n")
              f.write(f"codebuild_project={codebuild_project}\n")
          PY

      - name: Package Sqitch migrations
        id: package
        run: |
          if [ -z "${{ steps.db.outputs.artifact_bucket }}" ]; then
            echo "ERROR: migration_artifact_bucket output is empty. Apply infra first." >&2
            exit 1
          fi
          if [ -z "${{ steps.db.outputs.codebuild_project }}" ]; then
            echo "ERROR: migration_codebuild_project_name output is empty. Apply infra first." >&2
            exit 1
          fi
          key="migrations/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          tar -czf /tmp/rifaapp-sqitch.tar.gz -C apps/api rifaapp/db
          aws s3 cp /tmp/rifaapp-sqitch.tar.gz "s3://${{ steps.db.outputs.artifact_bucket }}/${key}"
          echo "source_key=${key}" >> "$GITHUB_OUTPUT"

      - name: Run migrations in CodeBuild
        run: |
          overrides=$(python3 - <<'PY'
          import json
          import os

          values = {
              "MIGRATION_SOURCE_KEY": os.environ["MIGRATION_SOURCE_KEY"],
              "MIGRATION_COMMAND": os.environ["MIGRATION_COMMAND"],
          }
          print(json.dumps([
              {"name": name, "value": value, "type": "PLAINTEXT"}
              for name, value in values.items()
          ]))
          PY
          )

          build_id=$(aws codebuild start-build \
            --project-name "${{ steps.db.outputs.codebuild_project }}" \
            --environment-variables-override "$overrides" \
            --query 'build.id' \
            --output text)

          echo "Started CodeBuild migration: $build_id"
          while true; do
            status=$(aws codebuild batch-get-builds --ids "$build_id" --query 'builds[0].buildStatus' --output text)
            echo "CodeBuild status: $status"
            case "$status" in
              SUCCEEDED)
                exit 0
                ;;
              FAILED|FAULT|STOPPED|TIMED_OUT)
                aws codebuild batch-get-builds --ids "$build_id" --query 'builds[0].logs.deepLink' --output text
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done
        env:
          MIGRATION_SOURCE_KEY: ${{ steps.package.outputs.source_key }}
          MIGRATION_COMMAND: ${{ inputs.target }}
