name: Migrate Database

on:
  workflow_dispatch:
    inputs:
      backend_ref:
        description: "Ref del backend para migraciones (branch o tag). Opcional."
        required: false
        default: "main"
        type: string
      target:
        description: "Tipo de migracion"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - verify
          - status

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_VERSION: '1.5.7'
  TG_VERSION: '0.96.1'
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TG_NON_INTERACTIVE: "true"

concurrency:
  group: rifaapp-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Run database migrations
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.backend_ref || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Setup Terragrunt
        run: |
          curl -sL "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TG_VERSION }}/terragrunt_linux_amd64" -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read DB outputs from Terraform
        id: db
        working-directory: infra/terraform/live/shared/db
        run: |
          terragrunt output -json > /tmp/db_outputs.json
          python3 - <<'PY'
          import json, os
          with open("/tmp/db_outputs.json", "r") as f:
              data = json.load(f)
          endpoint = data.get("db_cluster_endpoint", {}).get("value", "")
          port = str(data.get("db_port", {}).get("value", "5432"))
          name = data.get("db_name", {}).get("value", "rifaapp")
          user = data.get("db_username", {}).get("value", "appuser")
          secret_arn = data.get("db_secret_arn", {}).get("value", "")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"endpoint={endpoint}\n")
              f.write(f"port={port}\n")
              f.write(f"name={name}\n")
              f.write(f"user={user}\n")
              f.write(f"secret_arn={secret_arn}\n")
          PY

      - name: Retrieve DB password from Secrets Manager
        id: secret
        run: |
          SECRET_ARN="${{ steps.db.outputs.secret_arn }}"
          if [ -z "$SECRET_ARN" ]; then
            echo "ERROR: db_secret_arn is empty. Cannot retrieve password." >&2
            exit 1
          fi
          PASSWORD=$(aws secretsmanager get-secret-value --secret-id "$SECRET_ARN" --query 'SecretString' --output text | python3 -c "import json,sys; print(json.load(sys.stdin)['password'])")
          echo "db_password=$PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Install Sqitch
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbd-pg-perl sqitch
          sqitch --version

      - name: Run migrations
        working-directory: apps/api
        env:
          DB_HOST: ${{ steps.db.outputs.endpoint }}
          DB_PORT: ${{ steps.db.outputs.port }}
          DB_NAME: ${{ steps.db.outputs.name }}
          DB_USER: ${{ steps.db.outputs.user }}
          PGPASSWORD: ${{ steps.secret.outputs.db_password }}
        run: |
          echo "Running sqitch ${{ inputs.target }}..."
          cd rifaapp/db
          SQITCH_TARGET="db:pg://${DB_USER}@${DB_HOST}:${DB_PORT}/${DB_NAME}"
          sqitch ${{ inputs.target }} "${SQITCH_TARGET}"
